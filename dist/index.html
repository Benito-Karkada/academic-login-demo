<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>IEEE - Sign in to access secure content</title>

  <!-- Put favicon.ico in the same folder as this HTML file -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
      font-family: Verdana, Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      margin: 0;
      background: #8b8b8b;
      color: #666666;
      font-size: 13px;
    }

    /* =========================================================
       OUTER WHITE MODAL
       ========================================================= */

    .page {
      position: relative;

      width: 500px;
      height: 371px;

      margin: 0 auto;

      background: #ffffff;

      border: 0;
      box-shadow: none;
    }

    /* =========================================================
       BLUE IEEE TITLE BAR
       ========================================================= */

    .topbar {
      width: 100%;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 10px;

      background: linear-gradient(
        to bottom,
        #1797ce 0%,
        #0781ba 48%,
        #0874a8 100%
      );

      border-top: 1px solid #4db3df;
      border-bottom: 1px solid #086b99;

      color: #ffffff;

      font-family: Verdana, Arial, sans-serif;
      font-size: 18px;
      font-weight: 800;
      line-height: 26px;

      text-align: center;
      white-space: nowrap;
    }

    /* =========================================================
       MAIN CONTENT AREA
       ========================================================= */

    main {
      width: 100%;
      height: calc(100% - 48px);

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding-top: 32px;
    }

    /* =========================================================
       INNER SIGN-IN MODULE
       ========================================================= */

    .login-box {
      position: relative;

      width: 350px;
      height: 246px;

      margin: 0;

      border-left: 1px solid #767676;
      border-bottom: 1px solid #767676;

      background: #ffffff;
    }

    /*
      Draw the right border separately so it begins
      below the clipped corner.
    */
    .login-box::after {
      content: "";

      position: absolute;

      top: 8px;
      right: 0;
      bottom: 0;

      width: 1px;

      background: #767676;

      pointer-events: none;
    }

    /* =========================================================
       GREY SIGN-IN HEADER
       ========================================================= */

    .box-title {
      position: relative;

      width: 100%;
      height: 30px;

      padding: 6px 13px 0;

      background: #767676;

      color: #ffffff;

      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 15px;

      /*
        Actual cutout. Nothing white is drawn over
        the corner.
      */
      clip-path: polygon(
        0 0,
        calc(100% - 8px) 0,
        100% 8px,
        100% 100%,
        0 100%
      );
    }

    /* =========================================================
       CONTENT INSIDE SIGN-IN MODULE
       ========================================================= */

    .box-body {
      padding: 10px;
      padding-right: 20px;
    }

    .field {
      margin: 0;
    }

    /* =========================================================
       LABELS
       ========================================================= */

    label {
      display: block;

      margin: 5px 5px 5px 0;

      color: #666666;

      font-family: Verdana, Arial, sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 18px;
    }

    /* =========================================================
       INPUT FIELDS
       ========================================================= */

    input {
      display: block;

      width: 155px;
      min-width: 120px;
      max-width: 155px;
      height: 25px;

      margin: 0 0 10px 0;

      padding: 2px 4px;

      border: 1px solid #999999;
      border-radius: 0;

      background: #ffffff;
      color: #333333;

      font-family: Verdana, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;

      box-shadow: none;
    }

    /*
      Rounded focus outline shown when either
      input field is selected.
    */
    input:focus {
      outline: 2px solid -webkit-focus-ring-color;
      outline-offset: 1px;

      border-radius: 2px;
    }

    /* =========================================================
       FORGOT PASSWORD
       ========================================================= */

    .forgot {
      position: relative;
      display: inline-block;

      margin-top: 0;
      padding-left: 10px;

      color: #2a6496;

      font-family: Verdana, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 14px;

      text-decoration: none;

      cursor: pointer;
    }

    /*
      Thin orange chevron.
    */
    .forgot::before {
      content: "";

      position: absolute;

      left: 1px;
      top: 4px;

      width: 4px;
      height: 4px;

      border-top: 1px solid #e37222;
      border-right: 1px solid #e37222;

      transform: rotate(45deg);
    }

    .forgot:hover,
    .forgot:focus {
      color: #2a6496;
      text-decoration: underline;
    }

    /* =========================================================
       BUTTON POSITIONING
       ========================================================= */

    .actions {
      display: flex;
      justify-content: flex-end;

      margin-top: 11px;
      padding-right: 8px;
    }

    /* =========================================================
       ORANGE SIGN-IN BUTTON
       ========================================================= */

    #signin-button {
      position: relative;

      display: block;

      width: 80px;
      height: 24px;

      margin: 0;

      padding: 2px 0 4px;

      border: 0;
      border-radius: 0;

      background: linear-gradient(
        to bottom,
        #ffae32 0%,
        #f98c21 45%,
        #ef650c 100%
      );

      color: #ffffff;

      font-family: Verdana, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 17px;

      text-align: center;

      cursor: pointer;

      clip-path: polygon(
        0 0,
        calc(100% - 6px) 0,
        100% 6px,
        100% 100%,
        0 100%
      );
    }

    #signin-button:hover {
      background: linear-gradient(
        to bottom,
        #ffbb46 0%,
        #fa952e 45%,
        #f17112 100%
      );
    }

    #signin-button:active {
      background: linear-gradient(
        to bottom,
        #eb7916 0%,
        #df5b08 100%
      );
    }

    a:focus-visible,
    button:focus-visible {
      outline: 1px dotted #000000;
      outline-offset: 2px;
    }
  </style>
</head>

<body>

  <div class="page">

    <header class="topbar">
      IEEE - Sign in to access secure content
    </header>

    <main>

      <section
        class="login-box"
        aria-labelledby="signin-title"
      >

        <div
          class="box-title"
          id="signin-title"
        >
          Sign in
        </div>

        <div class="box-body">

          <!-- Email -->
          <div class="field">

            <label for="email">
              Email address:
            </label>

            <input
              id="email"
              type="text"
              autocomplete="off"
            >

          </div>

          <!-- Password -->
          <div class="field">

            <label for="password-display">
              Password:
            </label>

            <input
              id="password-display"
              type="password"
              autocomplete="off"
            >

          </div>

          <!-- Forgot password -->
          <a
            class="forgot"
            href="https://www.ieee.org/profile/public/forgotpassword/forgotUsernamePassword.html?url=https://www.ieee.org"
            target="_blank"
            rel="noopener noreferrer"
          >
            Forgot password
          </a>

          <!-- Sign in -->
          <div class="actions">

            <button
              id="signin-button"
              type="button"
            >
              Sign in
            </button>

          </div>

        </div>

      </section>

    </main>

  </div>

  <script>
    const emailField = document.getElementById("email");
    const passwordField = document.getElementById("password-display");
    const signInButton = document.getElementById("signin-button");

    signInButton.addEventListener("click", function () {
      const email = emailField.value.trim();
      const password = passwordField.value.trim();

      if (email === "" || password === "") {
        return;
      }

      window.location.href = "https://haveibeenpwned.com/";
    });
  </script>

</body>

</html>
