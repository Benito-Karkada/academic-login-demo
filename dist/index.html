<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A non-functional retro institutional sign-in mockup for local UI testing.">
  <title>Academic Access — Sign in demo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230072ad'/%3E%3Cpath d='M7 9h18v3H7zm0 6h18v3H7zm0 6h18v3H7z' fill='white'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; }

    body {
      margin: 0;
      background: #d2d2d2;
      color: #5b5b5b;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
    }

    .page {
      position: relative;
      width: min(100%, 760px);
      min-height: 560px;
      margin: 0 auto;
      border: 2px solid #8f8f8f;
      background: #f7f7f7;
      box-shadow: 0 0 0 1px #ffffff inset;
    }

    .topbar {
      height: 50px;
      border-top: 1px solid #54b8e5;
      border-bottom: 1px solid #0a5b8a;
      background: linear-gradient(#118bc7, #0875ad 52%, #136c9b);
      color: #ffffff;
      padding: 11px 25px 0;
      font-size: 19px;
      font-weight: bold;
      letter-spacing: .1px;
      text-shadow: 0 1px 0 #03507b;
    }

    .demo-tag {
      position: absolute;
      top: 14px;
      right: 18px;
      border: 1px solid rgba(255,255,255,.7);
      background: rgba(0,52,84,.36);
      color: #fff;
      padding: 2px 7px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: .08em;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 32px 18px 64px;
    }

    .login-box {
      width: 350px;
      border: 1px solid #868686;
      background: #ffffff;
    }

    .box-title {
      position: relative;
      height: 31px;
      background: #7a7a7a;
      color: #ffffff;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .box-title::after {
      content: "";
      position: absolute;
      top: 0;
      right: -1px;
      width: 0;
      height: 0;
      border-top: 11px solid #ffffff;
      border-left: 11px solid transparent;
    }

    .box-body {
      min-height: 221px;
      padding: 15px 10px 22px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #5f5f5f;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 155px;
      height: 26px;
      border: 1px solid #aaa;
      border-top-color: #8e8e8e;
      background: #fbfbfb;
      color: #777;
      padding: 3px 5px;
      font: 13px Arial, Helvetica, sans-serif;
      box-shadow: 1px 1px 0 #eee inset;
    }

    input:focus {
      outline: 1px dotted #333;
      outline-offset: 1px;
    }

    .forgot {
      display: inline-block;
      margin-top: 0;
      color: #0877bd;
      font-size: 12px;
      text-decoration: none;
    }

    .forgot::before {
      content: "›";
      margin-right: 4px;
      color: #ed650c;
      font-size: 15px;
      font-weight: bold;
    }

    .forgot:hover { text-decoration: underline; }

    .actions {
      display: flex;
      justify-content: flex-end;
      padding: 11px 18px 0 0;
    }

    button {
      min-width: 80px;
      height: 25px;
      border: 1px solid #e86a0b;
      border-top-color: #ffb23e;
      border-left-color: #ff9f26;
      background: linear-gradient(#ffad31 0%, #f57b19 54%, #e85d08 100%);
      color: #ffffff;
      padding: 2px 13px 3px;
      font: bold 13px Arial, Helvetica, sans-serif;
      text-shadow: 0 1px 0 #bd4700;
      cursor: pointer;
    }

    button:hover { background: linear-gradient(#ffbb4e, #f68727 54%, #e76510); }

    button:focus-visible, a:focus-visible {
      outline: 1px dotted #000;
      outline-offset: 2px;
    }

    .notice {
      display: none;
      margin: 15px 0 0;
      border: 1px solid #7ea5bc;
      background: #e8f4fa;
      color: #35596d;
      padding: 7px 8px;
      font-size: 11px;
      line-height: 1.35;
    }

    .notice.visible { display: block; }

    .safety {
      position: absolute;
      right: 15px;
      bottom: 12px;
      left: 15px;
      color: #888;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 520px) {
      body { background: #f7f7f7; }
      .page { min-height: 100vh; border-width: 1px; }
      .topbar { padding-left: 16px; padding-right: 75px; font-size: 16px; }
      .demo-tag { right: 9px; }
      main { padding-top: 28px; }
      .login-box { width: min(350px, 100%); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">ACADEMIC ACCESS - Sign in to access secure content</header>
    <span class="demo-tag">DEMO</span>

    <main>
      <section class="login-box" aria-labelledby="signin-title">
        <div class="box-title" id="signin-title">Sign in</div>
        <div class="box-body">
          <div class="field">
            <label for="email">Email address:</label>
            <input id="email" type="text" value="" readonly aria-describedby="safety-note">
          </div>

          <div class="field">
            <label for="password-display">Password:</label>
            <input id="password-display" type="text" value="" readonly aria-label="Password demonstration field, read only">
          </div>

          <a class="forgot" href="#demo-notice">Forgot password</a>

          <div class="actions">
            <button id="signin-button" type="button">Sign in</button>
          </div>

          <p class="notice" id="demo-notice" role="status" tabindex="-1">Local visual demo only. No request was sent and no information was stored.</p>
        </div>
      </section>
    </main>

    <div class="safety" id="safety-note">Not affiliated with IEEE · Fields are read-only · No credentials are collected</div>
  </div>

  <script>
    const notice = document.querySelector('#demo-notice');
    const showNotice = (event) => {
      event.preventDefault();
      notice.classList.add('visible');
      notice.focus();
    };
    document.querySelector('#signin-button').addEventListener('click', showNotice);
    document.querySelector('.forgot').addEventListener('click', showNotice);
  </script>
</body>
</html>
