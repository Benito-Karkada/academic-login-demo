<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Academic Access — Sign in demo</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230072ad'/%3E%3Cpath d='M7 9h18v3H7zm0 6h18v3H7zm0 6h18v3H7z' fill='white'/%3E%3C/svg%3E"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
    }

    body {
      margin: 0;

      background: #8b8b8b;
      color: #666666;

      font-family: Verdana, Arial, sans-serif;
      font-size: 13px;
    }


    /* =========================================================
       OUTER WHITE COMPONENT
       ========================================================= */

    .page {
      position: relative;

      width: 500px;
      height: 370px;

      margin: 0 auto;

      background: #ffffff;

      border: 0;
      box-shadow: none;
    }


    /* =========================================================
       BLUE IEEE HEADER
       ========================================================= */

    .topbar {
      width: 100%;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 8px;

      border-top: 1px solid #54b8e5;
      border-bottom: 1px solid #0a5b8a;

      background: linear-gradient(
        #118bc7 0%,
        #0875ad 52%,
        #136c9b 100%
      );

      color: #ffffff;

      font-family: Verdana, Arial, sans-serif;
      font-size: 18px;
      font-style: normal;
      font-weight: 800;
      line-height: 26px;

      text-align: center;
      white-space: nowrap;

      text-shadow: 0 1px 0 #03507b;
    }


    /* =========================================================
       MAIN AREA
       ========================================================= */

    main {
      width: 100%;
      height: calc(100% - 52px);

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding-top: 32px;
    }


    /* =========================================================
       INNER SIGN-IN BOX
       ========================================================= */

    .login-box {
      position: relative;

      width: 350px;
      height: 246px;

      margin: 0;

      /*
        No normal top/right border because those would
        show through the clipped header corner.
      */
      border: 0;
      border-left: 1px solid #868686;
      border-bottom: 1px solid #868686;

      background: #ffffff;
    }

    /*
      Right-hand outline.

      Starts 8px below the top so it does not appear
      inside the clipped corner.
    */
    .login-box::after {
      content: "";

      position: absolute;

      top: 8px;
      right: 0;
      bottom: 0;

      width: 1px;

      background: #868686;

      pointer-events: none;
    }


    /* Grey Sign-in header */
    .box-title {
      position: relative;

      width: 100%;
      height: 31px;

      padding: 6px 12px 0;

      background: #767676;
      color: #ffffff;

      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-style: normal;
      font-weight: 500;
      line-height: 15px;

      /*
        Actual clipped upper-right corner.
      */
      clip-path: polygon(
        0 0,
        calc(100% - 8px) 0,
        100% 8px,
        100% 100%,
        0 100%
      );
    }

    .box-title::before,
    .box-title::after {
      content: none;
      display: none;
    }


    /* =========================================================
       SIGN-IN BOX CONTENT
       ========================================================= */

    .box-body {
      padding: 14px 10px 20px;
    }

    .field {
      margin-bottom: 14px;
    }


    /* Email address / Password labels */

    label {
      display: block;

      margin-bottom: 5px;

      color: #666666;

      font-family: Verdana, Arial, sans-serif;
      font-size: 12px;
      font-style: normal;
      font-weight: 700;
      line-height: 17px;
    }


    /* Input boxes */

    input {
      display: block;

      width: 155px;
      height: 25px;

      padding: 2px 4px;

      border: 1px solid #aaaaaa;
      border-top-color: #8e8e8e;

      background: #fbfbfb;
      color: #666666;

      font-family: Verdana, Arial, sans-serif;
      font-size: 11px;
      font-style: normal;
      font-weight: 400;

      box-shadow: 1px 1px 0 #eeeeee inset;
    }

    input:focus {
      outline: 1px dotted #333333;
      outline-offset: 1px;
    }


    /* =========================================================
       FORGOT PASSWORD
       ========================================================= */

    .forgot {
      position: relative;
      display: inline-block;

      margin-top: 0;
      padding-left: 10px;

      color: rgb(42, 100, 150);

      font-family: Verdana, Arial, sans-serif;
      font-size: 11px;
      font-style: normal;
      font-weight: 400;
      line-height: 14px;

      text-decoration: none;

      cursor: pointer;
    }


    /*
      Thin orange chevron.
    */

    .forgot::before {
      content: "";

      position: absolute;

      left: 1px;
      top: 4px;

      width: 4px;
      height: 4px;

      border-top: 1px solid #ed650c;
      border-right: 1px solid #ed650c;

      transform: rotate(45deg);
    }

    .forgot:hover {
      text-decoration: underline;
    }


    /* =========================================================
       SIGN-IN BUTTON AREA
       ========================================================= */

    .actions {
      display: flex;
      justify-content: flex-end;

      padding: 11px 18px 0 0;
    }


    /* =========================================================
       ORANGE SIGN-IN BUTTON
       ========================================================= */

    button {
      position: relative;

      min-width: 80px;
      height: 25px;

      padding: 2px 13px 3px;

      border: 0;

      background: linear-gradient(
        #ffad31 0%,
        #f57b19 54%,
        #e85d08 100%
      );

      color: #ffffff;

      font-family: Verdana, Arial, sans-serif;
      font-size: 12px;
      font-style: normal;
      font-weight: 700;
      line-height: 17px;

      text-align: center;

      text-shadow: 0 1px 0 #bd4700;

      cursor: pointer;

      /*
        Actual clipped corner.
      */

      clip-path: polygon(
        0 0,
        calc(100% - 6px) 0,
        100% 6px,
        100% 100%,
        0 100%
      );
    }

    button:hover {
      background: linear-gradient(
        #ffbb4e 0%,
        #f68727 54%,
        #e76510 100%
      );
    }


    /* =========================================================
       KEYBOARD FOCUS
       ========================================================= */

    button:focus-visible,
    a:focus-visible {
      outline: 1px dotted #000000;
      outline-offset: 2px;
    }

  </style>
</head>


<body>

  <div class="page">

    <!-- Blue IEEE banner -->
    <header class="topbar">
      IEEE - Sign in to access secure content
    </header>


    <main>

      <section
        class="login-box"
        aria-labelledby="signin-title"
      >

        <!-- Grey Sign in bar -->
        <div
          class="box-title"
          id="signin-title"
        >
          Sign in
        </div>


        <div class="box-body">

          <!-- Email -->
          <div class="field">

            <label for="email">
              Email address:
            </label>

            <input
              id="email"
              type="text"
              value=""
              readonly
            >

          </div>


          <!-- Password -->
          <div class="field">

            <label for="password-display">
              Password:
            </label>

            <input
              id="password-display"
              type="text"
              value=""
              readonly
              aria-label="Password demonstration field, read only"
            >

          </div>


          <!-- Forgot password -->
          <a
            class="forgot"
            href="https://www.ieee.org/profile/public/forgotpassword/forgotUsernamePassword.html?url=https://www.ieee.org"
            target="_blank"
            rel="noopener noreferrer"
          >
            Forgot password
          </a>


          <!-- Sign in -->
          <div class="actions">

            <button
              id="signin-button"
              type="button"
              onclick="window.location.href='home.html'"
            >
              Sign in
            </button>

          </div>

        </div>

      </section>

    </main>

  </div>

</body>

</html>
